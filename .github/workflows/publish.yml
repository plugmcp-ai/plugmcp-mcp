name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - name: Tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      # setup-node writes _authToken=${NODE_AUTH_TOKEN} into NPM_CONFIG_USERCONFIG.
      # An empty/dummy token makes npm skip OIDC and fail with E404. Strip it so
      # Trusted Publisher (OIDC) can authenticate.
      - name: Enable npm OIDC auth
        run: |
          NPMRC_PATH="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$NPMRC_PATH" ]; then
            sed -i '/_authToken/d' "$NPMRC_PATH"
          fi
          npm --version

      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: Install mcp-publisher
        run: |
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      # ai.plugmcp/* is proven by https://plugmcp.ai/.well-known/mcp-registry-auth
      - name: Log in to the MCP Registry
        run: ./mcp-publisher login http --domain plugmcp.ai --private-key "$MCP_REGISTRY_PRIVATE_KEY"
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
